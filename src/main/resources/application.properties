spring.application.name=OilRisk_Alert
server.port=${SERVER_PORT:8080}

# MySQL Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/oilrisk?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:123456}
spring.sql.init.mode=never
spring.sql.init.encoding=UTF-8

# MyBatis
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.example.oilrisk_alert.entity
mybatis.configuration.map-underscore-to-camel-case=true

# Jackson date format
spring.jackson.date-format=yyyy-MM-dd
spring.jackson.time-zone=Asia/Shanghai

# Python prediction engine
python.engine.url=${PYTHON_ENGINE_URL:http://localhost:5000}

# LLM API Configuration
llm.api.key=${LLM_API_KEY:}
llm.api.url=${LLM_API_URL:https://apis.iflow.cn/v1/chat/completions}
llm.api.model=${LLM_API_MODEL:qwen3-max}

# CORS
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
