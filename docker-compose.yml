services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-oilrisk}"
      MYSQL_USER: "${MYSQL_USER:-oilrisk}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./src/main/resources/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  python-engine:
    build:
      context: .
      dockerfile: docker/python-engine.Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: "${MYSQL_DATABASE:-oilrisk}"
      DB_USER: "${MYSQL_USER:-oilrisk}"
      DB_PASSWORD: "${MYSQL_PASSWORD}"
      FRED_API_KEY: "${FRED_API_KEY:-}"
      EIA_API_KEY: "${EIA_API_KEY:-}"
      HTTP_PROXY: "${HTTP_PROXY:-}"
      HTTPS_PROXY: "${HTTPS_PROXY:-}"
      YF_BATCH_SIZE: "${YF_BATCH_SIZE:-5}"
      YF_BATCH_DELAY: "${YF_BATCH_DELAY:-2.0}"
      YF_SINGLE_DELAY: "${YF_SINGLE_DELAY:-1.5}"
      BACKFILL_ON_STARTUP: "${BACKFILL_ON_STARTUP:-false}"
      COLLECT_ON_STARTUP: "${COLLECT_ON_STARTUP:-false}"
      MODEL_DIR: /app/OilRisk_System
      DATA_PATH: /app/data/Final_Oil_Dataset_Cleaned.csv
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "${PYTHON_ENGINE_PORT:-5000}:5000"

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    restart: unless-stopped
    environment:
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-oilrisk}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8"
      SPRING_DATASOURCE_USERNAME: "${MYSQL_USER:-oilrisk}"
      SPRING_DATASOURCE_PASSWORD: "${MYSQL_PASSWORD}"
      PYTHON_ENGINE_URL: "http://python-engine:5000"
      APP_CORS_ALLOWED_ORIGINS: "${APP_CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_API_URL: "${LLM_API_URL:-https://apis.iflow.cn/v1/chat/completions}"
      LLM_API_MODEL: "${LLM_API_MODEL:-qwen3-max}"
    depends_on:
      mysql:
        condition: service_healthy
      python-engine:
        condition: service_started
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  mysql_data:
